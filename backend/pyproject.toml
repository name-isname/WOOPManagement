[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.1",
    "fastmcp>=2.12.3",
    "mcp[cli]>=1.14.1",
    "openai-agents[litellm]>=0.3.3",
    "openai>=1.40.0",
    "rtoml>=0.12.0",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.36.0",
]

[project.scripts]
# 开发时自动热重载
dev = "uvicorn main:app --host 127.0.0.1 --port 8000 --reload"
# 生产/稳定运行（无热重载）
start = "uvicorn main:app --host 127.0.0.1 --port 8000"
